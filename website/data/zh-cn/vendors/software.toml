description = "Kernun 防火墙是一个商业软件包，由一组应用程序代理、配置工具和其他实用程序组成，并提供其源代码。它依赖于 FreeBSD 操作系统和一块硬件（目前支持 i386 PC 和 amd64 Hammer 架构）。Kernun 防火墙在控制所有网络层的数据通信方面非常有效。<br />Kernun 防火墙旨在在不同网络上的主机之间调解合法的通信（如果防火墙策略允许），同时阻止在一个网络上发起并以受 Kernun 保护的不同网络为目标的非法通信和网络攻击。它还可用于制止滥用网络资源，检测和阻止病毒、间谍软件、垃圾邮件和其他有害内容。"

