[[events]]
id = "asiabsdcon-2011"
name = "2011年亚洲BSD会议"
url = "http://2011.asiabsdcon.org/"
startDate = "2011-03-17"
endDate = "2011-03-20"
countryCode = "JP"
country = "日本"
city = "东京"
site = "东京理科大学"
description = "「AsiaBSDCon」是一个面向BSD系统用户和开发者的会议。该会议面向所有开发、部署和使用基于FreeBSD、NetBSD、OpenBSD、DragonFlyBSD、Darwin和MacOS X的系统的人。AsiaBSDCon是一个技术会议，旨在收集最好的技术论文和演讲，以确保我们开源社区的最新发展能与尽可能广泛的受众分享。"

