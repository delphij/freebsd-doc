description = "「EuroBSDCon」是面向BSD系统用户和开发者的年度欧洲技术会议。第十届欧洲BSD会议将于2010年10月在荷兰举行，包括技术分会、教程和FreeBSD开发者峰会。会议感兴趣的主题包括但不限于基于BSD的操作系统的应用、架构、实现、性能和安全，以及有关BSD使用的经济或组织方面的主题。"

