description = "「世界IPv6日」是由互联网协会于2011年6月8日0:00 UTC至23:59 UTC组织的为期24小时的IPv6试飞活动。FreeBSD计划通过帮助推广IPv6并在用户遇到紧急IPv6问题时提供帮助来做出贡献。请参阅我们专门的<a href=\"https://www.FreeBSD.org/ipv6/w6d.html\">FreeBSD与世界IPv6日</a>页面以获取更多信息以及您如何提供帮助。"

