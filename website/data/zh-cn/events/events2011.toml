description = "「印第安纳Linux节」是一个社区F/OSS会议，展示了社区在自由和开源软件、开源硬件和自由文化方面所能提供的最好的东西。我们还重点介绍了从业余爱好者到专业人士等所有这些社区中最优秀和最聪明的人。在Linux节期间，BSD认证小组将提供参加其BSDA认证考试的机会。"

