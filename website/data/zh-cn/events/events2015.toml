description = "Marshall Kirk McKusick 将教授他的 FreeBSD 内核课程，该课程基于《FreeBSD 操作系统设计与实现》第二版。课程将在加利福尼亚州伯克利历史悠久的山坡俱乐部进行。课程将每周授课，主要在周四晚上，从 1 月 22 日持续到 5 月 21 日。有关课程的详细信息和注册页面的链接可在 <a href=\"https://www.mckusick.com/courses/introeveclass.html\">https://www.mckusick.com/courses/introeveclass.html</a> 找到。不住在湾区但希望远程上课的人可以订阅，每周接收录制的课程，订阅地址为 <a href=\"https://www.mckusick.com/courses/introorderform.html\">https://www.mckusick.com/courses/introorderform.html</a>."

