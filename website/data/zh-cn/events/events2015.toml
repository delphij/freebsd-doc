description = "FOSDEM '15 是一个由社区为社区组织的免费非商业活动。其目标是为自由和开源开发者提供一个交流的场所。活动组织了一个 BSD 开发室，用于举办关于所有 BSD 系统的讲座，参与者可关注 <a href=\"https://lists.fosdem.org/pipermail/fosdem/2014-December/002083.html\">CFP</a>。届时将有多位 FreeBSD 开发者出席."

