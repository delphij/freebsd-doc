[[events]]
id = "bsdcam-2017"
name = "2017 剑桥开发者峰会 (BSDCam)"
url = "https://wiki.freebsd.org/DevSummit/201708"
startDate = "2017-08-02"
endDate = "2017-08-04"
countryCode = "UK"
country = "英国"
city = "剑桥"
site = "剑桥大学计算机实验室"
description = "一个非会议形式的开发者峰会，重点关注互动主题和反映与会者兴趣的会议。剑桥开发者峰会是一个稍长的三天活动，没有相关的会议，这使我们能够举办更长时间的工作组、头脑风暴会议，并就多个主题进行多天的开发。过去的重要焦点包括虚拟化、网络性能、沙盒、跟踪/调试、软件包和软件包安全、教学、非 x86 架构（如 ARM/MIPS/RISC-V）以及测试。"

