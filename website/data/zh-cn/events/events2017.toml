[[events]]
id = "eurobsdcon-2017"
name = "EuroBSDcon 2017"
url = "https://2017.eurobsdcon.org"
startDate = "2017-09-21"
endDate = "2017-09-24"
countryCode = "FR"
country = "法国"
city = "巴黎"
site = "圣马丁空间"
description = "EuroBSDcon 是欧洲年度技术会议，汇集了使用和开发基于 4.4BSD（Berkeley 软件发行版）操作系统家族及相关项目的用户和开发者。EuroBSDcon 提供了了解 BSD 世界最新消息、见证当代部署案例研究以及亲自会见其他使用 BSD 相关技术的用户和公司的绝佳机会。EuroBSDcon 也是思想、讨论和信息交流的温床，这些往往会转化为编程项目。该会议一直吸引着活跃的程序员、管理员和有抱负的学生，以及大型 IT 公司，他们发现该会议是为其员工提供便捷和高质量培训的选择。我们坚信高水平教育对技术的未来至关重要，因此非常欢迎学生和年轻人参加这次定期会议。"

