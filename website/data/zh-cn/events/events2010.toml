url = "http://wiki.freebsd.org/Bugathons/2010August"
startDate = "2010-08-06"
endDate = "2010-08-09"
description = "Bugathon 是由 FreeBSD 错误修复团队协调的活动。Bugathon 在 IRC（EFnet 的 #freebsd-bugbusters 频道）上举行，任何感兴趣的 FreeBSD 开发者和贡献者都可以在周末参加。他们专注于关闭尽可能多的问题报告并修复尽可能多的错误。第七次 Bugathon 的计划是处理 FreeBSD GNATS 数据库中包含补丁的许多问题报告，目的是提交它们、使它们达到可提交状态，或向提交者解释所提供补丁的问题。"

