description = "自由及开源软件开发者欧洲会议 (FOSDEM) 是一个免费的活动，供软件开发者会面、分享想法和协作。每年有超过 8000 名来自世界各地的开源开发者聚集在比利时布鲁塞尔的此活动中。在 FOSDEM 期间，开发者房间（devrooms）被分配给自组织的开源团体和项目，以便他们会面并展示其项目；一个 <a href=\"https://fosdem.org/2019/schedule/track/bsd/">BSD 开发者房间</a> 将举办关于 BSD 操作系统和项目的讲座。如果您想提交演讲，请参阅 <a href=\"http://blog.osorio.me/post.php?idpost=1\">征稿通知</a>。"

