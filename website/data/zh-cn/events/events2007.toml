description = "COSCUP 2007 是 ICOS（国际开源会议）的联合会议，旨在让开源嘉年华更加精彩。COSCUP 2007 的主要变化是，会议由台湾所有本地社区共同组织，我们希望通过这种合作扩大本地社区的参与。就像 COSCUP 的精神一样，在本次会议中，您可以既是参与者又是推广者，并参与会议的运营。COSCUP 2007 的主要议题包括基于网络的平台和嵌入式系统，因为 Web 2.0 和 OLPC 的普及；中文会议、闪电演讲和系统会议是多年来最有趣的主题。将有一些关于 FreeBSD 的演示和讲座。节目一如既往地吸引人，我们不仅邀请社区中的大人物，还邀请了不那么知名的本地开源项目开发者，以吸引更多人参与，让开源在台湾更加辉煌。"

