[[events]]
id = "bsd-narrative-history-ucbe-2007"
name = "课程：BSD 叙事史"
url = "http://www.unex.berkeley.edu/cat/course1556.html"
startDate = "2007-09-26"
endDate = "2007-09-26"
countryCode = "US"
country = "美国"
city = "旧金山"
site = "加州大学旧金山分校推广部：市场南中心 216 室"
description = "向其主要开发者之一学习 BSD（Berkeley 软件发行版）的历史，他将历史生动地呈现出来，并附有轶事和历史叙述的脚注。BSD 社区始于 1970 年代末的加州大学伯克利分校。您将听到该项目及其在 1980 年代鼎盛时期的发布所经历的成功和失败。伯克利时代以一场动荡的诉讼告终，最终伯克利胜诉，这使得 1992 年最终发布了 4.4BSD-Lite，一个开源版本的 BSD。讲座包括对 FreeBSD、NetBSD、OpenBSD、Darwin 和 Dragonfly 项目的简要评论，这些项目都起源于 4.4BSD-Lite 的发布。"

[[events]]
id = "kernel-internals-ucbe-2007"
name = "课程：FreeBSD 内核内部原理"
url = "http://www.unex.berkeley.edu/cat/course927.html"
startDate = "2007-09-29"
endDate = "2007-11-03"
countryCode = "US"
country = "美国"
city = "伯克利"
site = "加州大学伯克利分校推广部：金熊大楼 211 室"
description = "本课程将提供 FreeBSD 内核的坚实背景知识。课程将涵盖基本内核服务、进程结构、用于托管虚拟机的 FreeBSD jail 设施、调度、信号处理以及虚拟和物理内存管理。将描述内核 I/O 结构，展示 I/O 如何多路复用、特殊设备如何处理、字符处理如何执行以及缓冲区池如何管理。将描述文件系统的实现及其功能，包括软更新和快照。然后将描述文件系统接口，以展示如何使用它来支持多种文件系统类型，例如 Sun Microsystem 的网络文件系统 (NFS)。本课程还将涵盖 FreeBSD 基于套接字的网络架构、分层和实现。将讨论套接字通信原语和内部分层，重点是层之间的接口；将使用 TCP/IP 实现作为示例。将包括对路由问题的讨论。其他系统相关主题包括性能测量、系统调优和安全问题。演示文稿将强调代码组织、数据结构导航和算法。它不会涵盖系统的机器特定部分，例如设备驱动程序。2007 年 9 月 29 日、10 月 6 日和 27 日以及 11 月 3 日的周六；上午 9:00 至下午 5:30。9 月 29 日至 11 月 3 日：周六，上午 9 点至下午 5:30（10 月 13 日和 10 月 20 日无会议）。"

