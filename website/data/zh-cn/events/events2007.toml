countryCode = "US"
country = "美国"
city = "旧金山"
site = "加州大学旧金山分校推广部：市场南中心 216 室"
description = "BSD 社区始于 1970 年代末的加州大学伯克利分校。在 1980 年代，BSD 软件在伯克利开发并发布。1992 年，伯克利发布了其最终版本 4.4BSD-Lite，一个开源版本的 BSD。自那时起，FreeBSD、NetBSD、OpenBSD、Darwin 和 Dragonfly 项目继续独立开发。本次讲座追溯了 BSD 社区的历史和结构，从其最初在伯克利的一小群受薪员工，到如今组成 FreeBSD 项目的数千名志愿者开发者。它描述了伯克利建立的开发结构如何扩展，以创建一个支持全球不断增长和变化的开发者群体的自组织项目。"

