id = "bugsquash-2020-09-19"
name = "FreeBSD Bug 清理"
url = "https://wiki.freebsd.org/Bugathons"
startDate = "2020-09-19"
endDate = "2020-09-19"
site = "live.FreeBSD.org"
description = "2020年9月19日世界标准时间14:00-21:00，我们将举行一次协调的虚拟 Bug 清理活动。FreeBSD 有一个问题报告 (PR) 数据库，鼓励用户和开发者在此提交他们在基础系统和 ports 树中发现的问题和回归。Bug 清理是一个集中的会话，我们尝试分类、处理、修复和关闭 PR 数据库中尽可能多的报告。本次9月11日的 Bug 清理活动将重点关闭尽可能多的带有补丁的 PR。欢迎用户和开发者通过实时视频流和 IRC 频道参加和参与。"

