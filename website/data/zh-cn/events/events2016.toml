site = "山坡俱乐部"
description = "Marshall Kirk McKusick 将于 2016 年 1 月 21 日星期四晚上在加利福尼亚州伯克利教授他的课程“FreeBSD 内核内部：深入代码演练”。课程将在历史悠久的山坡俱乐部（Hillside Club，地址：2286 Cedar Street, Berkeley, CA 94709，位于伯克利校区以北三个街区）举行，每周一次，从 1 月 21 日星期四开始，到 5 月 12 日星期四结束，时间为晚上 6:30 至 10:00。您可以在 https://www.mckusick.com/courses/advclassform.html 报名参加课程。不住在湾区但希望远程上课的人可以订阅，每周接收录制的课程。"

[[events]]
id = "scale"
name = "SCaLE 14x：南加州 Linux 博览会"
url = "https://www.socallinuxexpo.org"
startDate = "2016-01-21"
endDate = "2016-01-24"
countryCode = "US"
country = "美国"
city = "帕萨迪纳"
site = "帕萨迪纳会议中心"
description = "南加州 Linux 博览会 SCaLE 14X 现已迎来第 14 个年头，是北美最大的 Linux 和开源软件展会。为期四天的活动——从 2016 年 1 月 21 日至 24 日，在帕萨迪纳会议中心举行——吸引了来自北美各地的顶尖演讲者和参展商。会议和研讨会涵盖从初学者教程到经验丰富的系统管理员或软件开发人员的研讨会。此外，周末前还有各种自由和开源软件社区团体举办的专业研讨会。虽然我们的名字中有 Linux，但我们也有相当多的 BSD 内容，包括 FreeBSD 基金会和 FreeBSD 项目的展位。今年还将包括现场 BSDA 考试。欲了解更多信息或注册，请访问 https://www.socallinuxexpo.org。"

