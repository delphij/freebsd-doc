description = "FOSDEM 是一个免费的软件开发者活动，旨在让开发者们见面、分享想法，并参加项目负责人和提交者就各种主题进行的有趣演讲和演示。BSD 社区将出席，您可以在两天的活动中参观我们的展位，尝试在周六通过 BSDCG 考试，并在周日前往 BSD 开发室参加关于您最喜欢的 BSD 的演讲。"

