[[events]]
id = "asiabsdcon-2013"
name = "2013年亚洲BSD大会"
url = "http://2013.asiabsdcon.org/"
startDate = "2013-03-14"
endDate = "2013-03-17"
countryCode = "JP"
country = "日本"
city = "东京"
site = "东京理科大学"
description = "AsiaBSDCon 是一个面向基于 BSD 系统的用户和开发者的会议。该会议面向所有开发、部署和使用基于 FreeBSD、NetBSD、OpenBSD、DragonFlyBSD、Darwin 和 MacOS X 系统的用户。AsiaBSDCon 是一个技术会议，旨在收集最佳技术论文和演示文稿，以确保我们开源社区的最新发展能够与最广泛的受众分享。"

[[events]]
id = "bsdday-2013"
name = "2013年中欧BSD日"
url = "http://bsdday.eu/2013"
startDate = "2013-04-06"
endDate = "2013-04-06"
countryCode = "IT"
country = "意大利"
city = "那不勒斯"
site = "生物结构与生物成像研究所"
description = "请注意，又一个 BSD-Day 即将到来：明年四月，Beastie 将访问那不勒斯，召集意大利和中欧的 BSD 人士齐聚一堂！本次活动为 BSD 开发者和爱好者提供了一个绝佳的机会，向更广泛的受众展示他们的工作，与同行分享他们的想法，并寻找潜在的合作伙伴。传统上，本次活动力求避免形式主义，不要求演讲者提交论文，也不要求与会者注册或支付入场费。但是，鼓励受邀者就他们最喜欢的 BSD 主题进行简短演讲。目标是激励所有人，尤其是大学生，看到我们方法的优势，并抓住机会使用 BSD 系统。"

