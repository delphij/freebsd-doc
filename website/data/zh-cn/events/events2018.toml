[[events]]
id = "bsdcam-2018"
name = "2018 剑桥开发者峰会 (BSDCam)"
url = "https://bsdcam.cl.cam.ac.uk"
startDate = "2018-08-15"
endDate = "2018-08-17"
countryCode = "UK"
country = "英国"
city = "剑桥"
site = "剑桥大学计算机实验室"
description = "一个非会议形式的开发者峰会，重点关注互动主题和反映与会者兴趣的会议。剑桥开发者峰会是一个稍长的三天活动，没有相关的会议，这让我们能够举行更长时间的工作组、头脑风暴会议，并就主题进行多天的黑客攻击。过去的重要焦点包括虚拟化、网络性能、沙盒、跟踪/调试、软件包和软件包安全、教学、非 x86 架构（如 ARM/MIPS/RISC-V）以及测试。"

[[events]]
id = "eurobsdcon-2018"
name = "EuroBSDcon 2018"
url = "https://2018.eurobsdcon.org"
startDate = "2018-09-20"
endDate = "2018-09-23"
countryCode = "RO"
country = "罗马尼亚"
city = "布加勒斯特"
site = "布加勒斯特理工大学"
description = "EuroBSDcon 是欧洲年度技术会议，汇集了从事和使用 4.4BSD（Berkeley Software Distribution）操作系统家族及相关项目的用户和开发者。EuroBSDcon 提供了了解 BSD 世界最新消息、见证当代部署案例研究以及亲自会见其他使用 BSD 相关技术的用户和公司的绝佳机会。EuroBSDcon 也是思想、讨论和信息交流的温床，这些往往会转化为编程项目。该会议一直吸引着活跃的程序员、管理员和有抱负的学生，以及大型 IT 公司，他们发现该会议是为其员工提供方便和高质量培训的选择。我们坚信高水平教育对技术的未来至关重要，因此非常欢迎学生和年轻人参加这次定期会议。"

