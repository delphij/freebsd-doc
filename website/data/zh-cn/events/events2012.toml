description = "2012 年加州 meetBSD 大会承诺将带来与众不同的体验。加州 meetBSD 大会并非普通的会议——它是来自 BSD 社区各地的思想交流盛会。2012 年加州 meetBSD 大会将包括社区安排的分组会议、讨论小组、5-10 分钟的“闪电演讲”，以及经验丰富的 BSD 专家的更长时间演讲。"

