site = "开姆尼茨工业大学"
description = "开姆尼茨 Linux 日是一个关于 Linux 和开源软件的会议。它对所有人开放——无论是新手还是专家。本次活动由 IN Chemnitz、CLUG、计算中心、开姆尼茨工业大学计算机科学学院以及众多志愿者共同组织。请查阅您的日程表，并在 3 月 17 日和 18 日做好标记。您不会后悔的。"

[[events]]
id = "asiabsdcon-2012"
name = "2012 年亚洲 BSD 大会"
url = "http://2012.asiabsdcon.org/"
startDate = "2012-03-22"
endDate = "2012-03-25"
countryCode = "JP"
country = "日本"
city = "东京"
site = "东京理科大学森户纪念馆"
description = "亚洲 BSD 大会是面向 BSD 系统用户和开发者的会议。本次会议面向所有开发、部署和使用基于 FreeBSD、NetBSD、OpenBSD、DragonFlyBSD、Darwin 和 MacOS X 系统的个人。亚洲 BSD 大会是一个技术会议，旨在收集最佳技术论文和演示文稿，以确保我们开源社区的最新发展能够与最广泛的受众分享。"

[[events]]
