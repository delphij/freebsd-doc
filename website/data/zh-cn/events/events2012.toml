description = "第四届基辅 BSD 大会将在乌克兰基辅举行。本次会议的主要目标是：让社区更快发展，延长系统正常运行时间，让用户更满意。今年将讨论嵌入式 BSD 系统、poudriere 和 pkgng 教程、mpd5 深入解析以及其他一些技术主题。"

