description = "欧洲 BSD 大会是面向从事和使用基于 BSD 操作系统及相关项目的人员举办的欧洲技术会议。2012 年欧洲 BSD 大会是第 11 届，将于 2012 年 10 月 20-21 日（教程 10 月 18-19 日）在波兰华沙举行。欧洲 BSD 大会是一个绝佳而独特的机会，可以了解我们日常使用的强大 BSD 系统，并与世界各地的其他开发者建立联系。"

