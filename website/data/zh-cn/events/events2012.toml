endDate = "2012-05-05"
countryCode = "AT"
country = "奥地利"
city = "维也纳"
site = "维也纳技术应用科学大学"
description = "今年五月，Beastie 将在维也纳与 Tux 一同巡游：又一场“DanuBSDCon”即将到来，汇聚中欧 BSD 社区成员！本次活动邀请了多位 BSD 开发者和爱好者，分享他们的工作，与同行交流，并寻找潜在的未来合作伙伴。一如既往，本次活动没有繁文缛节、论文、注册或参与费用，但我们鼓励受邀者就他们最喜欢的 BSD 相关主题进行简短演讲。目标是激励所有人，特别是大学生，参与 BSD 系统的工作。"

