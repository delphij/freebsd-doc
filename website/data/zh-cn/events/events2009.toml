name = "网络相关 Bugathon #6"
url = "https://wiki.freebsd.org/Bugathons/January2009"
startDate = "2009-01-30"
endDate = "2009-02-01"
description = "Bugathon 是由 FreeBSD bugbusting 团队协调的活动。Bugathon 在 IRC（EFnet 的 #freebsd-bugbusters 频道）上举行，感兴趣的 FreeBSD 开发者和贡献者会在周末参加。他们专注于尽可能多地解决问题报告和修复错误。第六次 Bugathon 的计划是处理 FreeBSD GNATS 数据库中所有与网络相关的问题报告。"

