description = "<a href=\"https://www.mckusick.com/courses/advclassform.html\">FreeBSD 内核内部：强化代码演练</a>课程深入研究了截至三月初的 FreeBSD 8-current 内核源代码。本课程面向对 FreeBSD 内核中使用的算法有良好理解并希望了解其实现细节的用户。课程将在历史悠久的 <a href=\"http://www.hillsideclub.org/\">Hillside Club</a>（位于 2286 Cedar Street, Berkeley, CA 94709，伯克利校区以北三个街区）举行，每周一次，从 3 月 18 日星期三开始，到 7 月 2 日星期四结束，时间为晚上 6:30 至 10:00。"

