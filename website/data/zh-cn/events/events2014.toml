endDate = "2014-05-17"
countryCode = "CA"
country = "加拿大"
city = "渥太华"
site = "渥太华大学"
description = "BSDCan 是一个面向 BSD 操作系统及其相关项目工作者的技术会议。这是一个开发者会议，重点关注新兴技术、研究项目和正在进行的工作。它还包括用户空间基础设施项目，并邀请自由软件开发者和商业供应商的贡献。会议设有系统管理、安全、黑客和嵌入式等专题。PGCon 紧随其后在同一地点举行。"

