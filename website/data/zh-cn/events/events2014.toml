url = "http://bsdcam.cl.cam.ac.uk/"
startDate = "2014-07-09"
endDate = "2014-07-12"
countryCode = "GB"
country = "英国"
city = "剑桥"
site = "剑桥大学"
description = "剑桥 FreeBSD 开发者峰会是一年一度的仅限受邀者参加的活动，旨在汇集开发者和供应商，共同讨论和构建 FreeBSD 项目的未来。今年的议题将包括 FreeBSD 11 的预期功能集、实施 9 和 10 分支的新发布策略、打包基础系统以及构建基础设施和工具以吸引更多嵌入式供应商使用 FreeBSD。"

