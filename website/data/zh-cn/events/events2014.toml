description = "EuroBSDcon 是关于开源 BSD 操作系统的欧洲顶级会议，吸引了来自欧洲和世界其他地区约 250 名高技能工程专业人士、软件开发者、计算机科学学生和教授以及用户。EuroBSDcon 的目标是交流有关 BSD 操作系统的知识，促进用户和开发者之间的协调与合作。2014 年索非亚 EuroBSDCon 的日期已定为 9 月 25-26 日为教程，9 月 27-28 日为主会议。"

