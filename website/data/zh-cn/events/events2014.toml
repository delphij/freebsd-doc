site = "东京理科大学"
description = "AsiaBSDCon 是一个面向 BSD 系统用户和开发者的会议。该会议面向所有开发、部署和使用基于 FreeBSD、NetBSD、OpenBSD、DragonFlyBSD、Darwin 和 MacOS X 等系统的人员。AsiaBSDCon 是一个技术会议，旨在收集最佳技术论文和演示文稿，以确保我们开源社区的最新发展能够与最广泛的受众分享。"

[[events]]
id = "bsdcan-2014"
