description = "XDC 是 FOSS 图形栈工作者每年聚会的会议。演讲涵盖项目状态、正在进行的工作、变更提案等。与许多类似的会议一样，这是开发者和用户面对面交流的绝佳机会。时隔许久，FreeBSD 将首次出席并就图形栈的状态发表演讲。主要目标是重新建立与上游的沟通，目前上游往往以 Linux 为中心。"

