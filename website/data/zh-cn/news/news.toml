[[news]]
date = "2016-07-06"
title = "新的FreeBSD核心团队当选"
description = "FreeBSD 项目很高兴地宣布2016年核心团队选举完成。FreeBSD 核心团队担任项目的“董事会”，负责批准新的 src 提交者、解决开发人员之间的争议、任命特定目的的子委员会（安全官、发布工程、端口管理器、网站管理员等），以及根据需要做出任何其他管理或政策决定。自 2000 年以来，核心团队每两年由 FreeBSD 开发人员选举一次。FreeBSD 核心团队很高兴地宣布 <a href=\"mailto:matthew@FreeBSD.org\">Matthew Seaman</a> 将继续担任 <a href=\"mailto:core-secretary@FreeBSD.org\">核心团队秘书</a>。有关选举的更多信息（以及核心团队新成员的名单）可以在官方<a href=\"https://lists.freebsd.org/pipermail/freebsd-announce/2016-July/001732.html\">公告</a>中找到。"

