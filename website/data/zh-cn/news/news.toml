[[news]]
date = "2020-01-21"
title = "在 Weblate 上翻译 FreeBSD 的官方文章和书籍"
description = "为了让新贡献者更容易地翻译<a href=\"https://www.freebsd.org/docs/books.html\">FreeBSD的官方文章和书籍</a>，该项目正在采用<a href=\"https://weblate.org/\">Weblate</a>作为其基于Web的持续本地化平台。该工具已被我们的一些翻译团队（pt_BR、es_ES和zh_CN）使用数月，由于取得了优异的成果和所采用的工作流程的成熟，我们相信我们已准备好向新的合作者开放。随着这个新工具的采用，翻译过程变得相当简单，任何愿意为项目贡献几分钟的人都可以为其做出贡献！如果您有兴趣通过翻译官方文档为文档项目做出贡献，您可以在我们的<a href=\"https://wiki.freebsd.org/DocTranslationOnWeblate\">wiki</a>上获取更多信息，并阅读发送到freebsd-translators邮件列表的<a href=\"https://lists.freebsd.org/pipermail/freebsd-translators/2019-December/000161.html\">公告</a>。"

