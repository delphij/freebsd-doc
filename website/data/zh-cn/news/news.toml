title = "FreeBSD 参与 Google 文档季"
description = "FreeBSD 项目再次作为<a href=\"https://developers.google.com/season-of-docs/docs/participants/\">指导组织</a>参与<a href=\"https://developers.google.com/season-of-docs\">Google 文档季</a>计划。该计划的目标是将开源和技术作者聚集在一起。技术作者花三个月时间与开源社区密切合作，将他们的专业知识带到项目的文档中。可用任务列表和联系信息可在<a href=\"https://wiki.freebsd.org/GoogleSeasonOfDocs\">FreeBSD wiki</a>上找到。"

