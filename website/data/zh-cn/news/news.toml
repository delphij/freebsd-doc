[[news]]
date = "2017-02-27"
title = "FreeBSD 项目将参与2017年 Google 编程之夏"
description = "FreeBSD 项目很高兴地宣布参与 Google 2017 年编程之夏计划，该计划资助暑期学生参与开源项目。这将是 FreeBSD 项目第十三年参与该计划，在 2005 年至 2016 年期间，已指导超过 200 名学生成功完成为期整个暑假的编码项目。过去成功的项目包括改进 Linux ABI 仿真、NFSv4 ACL、TCP 回归测试、FUSE 文件系统支持以及无数其他项目。许多学生后来成为 FreeBSD 开发人员，并通过 FreeBSD 基金会的持续支持参与世界各地的 FreeBSD 开发人员活动。欢迎有兴趣的参与者申请；更多信息，包括提案和截止日期信息，请访问 <a href=\"https://www.freebsd.org/projects/summerofcode.html\">FreeBSD 夏季项目页面</a>。"

