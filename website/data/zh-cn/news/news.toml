[[news]]
date = "2018-06-08"
title = "服务中断"
description = "FreeBSD 集群的部分将于6月9日星期六因电气工程而进行长时间的维护窗口而离线。服务将受到影响，最显著的是邮件列表流量和我们的一部分Web服务。维护窗口于6月9日11:00 UTC（美国太平洋时间04:00）开始，并持续到20:00 UTC（美国太平洋时间13:00）"

