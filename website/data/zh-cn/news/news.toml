[[news]]
date = "2018-01-04"
title = "关于 Meltdown 和 Spectre 攻击"
description = "关于 <a href=\"https://meltdownattack.com/\">Meltdown</a> 和 <a href=\"https://spectreattack.com/\">Spectre</a> 攻击：FreeBSD 于 2017 年 12 月下旬获悉这些问题。我们正在与 CPU 供应商和已发表的有关这些攻击的论文合作，以在 FreeBSD 上缓解这些攻击。由于攻击的根本性质，目前尚无补丁发布日期的估计。"

