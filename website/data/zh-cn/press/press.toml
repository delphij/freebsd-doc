siteUrl = "http://hostingadvice.com"
date = "2016-06-09"
author = "Alexandra Leslie"
description = "FreeBSD项目拥有400多名志愿者开发人员，是一支充满活力的力量，将控制权交到管理员手中。项目提交者Allan Jude自2002年以来一直是该项目的粉丝。他讨论了系统的内部结构和功能，这些功能吸引他为其文档做出贡献，然后为其开发做出贡献，以及十多年后他现在正在从事的工作。"

