author = "Abhishek Prakash"
description = "FreeBSD是最受欢迎的BSD发行版之一。二十多年来，它一直用于台式机、服务器和嵌入式设备。我们与FreeBSD基金会执行董事Deb Goodkin进行了交谈，讨论了FreeBSD项目的过去、现在和未来。"

[[press]]
name = "支持开源操作系统：与FreeBSD基金会的问答"
url = "https://www.techradar.com/news/supporting-an-open-source-operating-system-a-qanda-with-the-freebsd-foundation"
siteName = "techradar.com"
siteUrl = "https://techradar.com"
date = "2020-02-20"
author = ""
description = "在讨论微软Windows或苹果macOS的替代操作系统时，人们常常会想到Linux。然而，虽然Linux是UNIX的再创造，但FreeBSD更像是一种延续。这个免费的开源操作系统最初是由加州大学伯克利分校的学生开发的，这就是为什么其名称中的BSD代表伯克利软件发行版。"

[[press]]
name = "认识FreeBSD项目——26年及以后的旅程"
url = "https://hub.pfind.com/meet-freebsd-project/"
siteName = "pfind.com"
siteUrl = "https://hub.pfind.com"
date = "2019-08-29"
author = "William Chapman"
description = "在谈论用于各种设备的整个计算过程的操作系统或平台时，您可能经常听说过FreeBSD。然而，今天这个操作系统的实现显然不是那么出名，许多人不知道FreeBSD在当今计算技术中的贡献。由于这个操作系统通常不适用于普通用户，FreeBSD仍然是当今许多人不熟悉的东西。然而，它今天已在各种硬件和在线平台中使用，并且已经活跃使用了26年以上。"

[[press]]
name = "FreeBSD 26岁"
url = "https://lwn.net/Articles/791609/"
siteName = "LWN.net"
siteUrl = "https://lwn.net"
date = "2019-06-21"
author = "Sean Kerner"
description = "FreeBSD操作系统在得名26年后继续取得进展。正在进行的工作领域包括改进对RISC-V的支持、FUSE文件系统更新、C运行时更改和安全改进。FreeBSD日于6月19日庆祝，以纪念1993年为386BSD项目的一个分支创造FreeBSD名称的日期。然而，FreeBSD的第一个正式版本直到1993年11月1日才发布。"

