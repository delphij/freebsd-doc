[[press]]
name = "FreeBSD基金会宣布2019年6月19日为FreeBSD日"
url = "http://brilliancesecuritymagazine.com/press-release/freebsd-foundation-announces-freebsd-day-on-june-19-2019/"
siteName = "Brilliance Security Magazine"
siteUrl = "https://www.brilliancesecuritymagazine.com"
date = "2019-06-06"
author = "编辑人员"
description = "FreeBSD基金会，FreeBSD的支持者，世界上最古老、最大的开源计算机操作系统之一，被许多顶级公司使用，宣布2019年6月19日为FreeBSD日。FreeBSD日标志着1993年开发人员为新的开源操作系统命名的日期，并庆祝FreeBSD对开源计算的影响。"

[[press]]
name = "FreeBSD ZFS与ZoL性能，Ubuntu ZFS On Linux参考"
url = "https://www.phoronix.com/scan.php?page=article&item=freebsd-zol-april"
siteName = "Phoronix"
siteUrl = "https://www.phoronix.com"
date = "2019-04-22"
author = "Michael Larabel"
description = "总的来说，FreeBSD ZFS On Linux移植目前看起来不错，我们期待它能在FreeBSD 13.0及时成熟。iX Systems和所有相关人员做得很好，特别是ZFS On Linux项目。那些想帮助测试的人可以尝试FreeBSD ZoL版本。随着时间的推移和FreeBSD ZoL支持的进一步成熟，请继续关注更多基准测试和更多样化的硬件，但到目前为止，至少性能数据看起来不错。"

[[press]]
name = "我们为什么在FreeBSD之上构建我们的解决方案？"
